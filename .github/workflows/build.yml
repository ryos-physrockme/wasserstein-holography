name: Verify calculations and build PDF
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'notes/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-note-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Run independent checks
        run: python -m unittest discover -s tests -v
      - name: Recompute figures and numerical results
        run: |
          python src/krylov.py --output results
          python src/geodesic.py --output results/geodesic
          python src/state_distance.py --output results/state_distance
          python src/phase_space.py --output results/phase_space
          python src/boundary_probe.py --output results/boundary_probe
      - name: Install LuaLaTeX and Japanese typesetting
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-luatex texlive-lang-japanese texlive-latex-extra
      - name: Compile research notes
        run: |
          for topic in note geodesic state_distance phase_space boundary_probe; do
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build "notes/${topic}.tex"
          done
      - name: Upload PDF and verification results
        uses: actions/upload-artifact@v4
        with:
          name: research-note-and-verification
          path: |
            build/note.pdf
            build/geodesic.pdf
            build/state_distance.pdf
            build/phase_space.pdf
            build/boundary_probe.pdf
            results/
          if-no-files-found: error
          retention-days: 90
      - name: Save compiled PDF and results on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$(git rev-parse HEAD)" ]; then
            echo 'main changed during the build; keeping the artifact without overwriting newer work.'
            exit 0
          fi
          mkdir -p docs
          for topic in note geodesic state_distance phase_space boundary_probe; do
            cp "build/${topic}.pdf" "docs/${topic}.pdf"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/note.pdf docs/geodesic.pdf docs/state_distance.pdf docs/phase_space.pdf docs/boundary_probe.pdf results/
          if ! git diff --cached --quiet; then
            git commit -m 'Build research notes and refresh verification results'
            git push origin HEAD:main
          fi
